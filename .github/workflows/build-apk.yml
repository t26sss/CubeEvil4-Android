name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # ประวัติ commit ทั้งหมด เพื่อกู้ไฟล์ที่ถูกวางทับ

      # แตก modern-controls-v2.zip (ไฟล์ใหม่เท่านั้น ไม่เขียนทับไฟล์เดิม) แล้วรันสคริปต์แก้ไฟล์เดิมเฉพาะจุด
      - name: Apply modern-controls changes
        run: |
          unzip -o modern-controls-v2.zip
          python3 restore_originals.py
          python3 apply_modern_controls.py
          python3 apply_touchlook.py
          python3 apply_aimwalk.py
          python3 apply_bonedump.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # เก็บแคช Gradle ไว้ใช้รอบต่อไป (ไม่ต้องโหลดไลบรารีใหม่ทุกครั้ง)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('port/android-decomp/**/*.gradle', 'port/android-decomp/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install build tools and NDK r28c
        run: sudo port/tools/whole_setup_linux.sh --android

      - name: Build game core (.so)
        run: port/tools/whole_build_android.sh --ndk /opt/android-ndk-r28c --abi arm64-v8a

      # ใช้ keystore ตัวเดิมทุกครั้ง (ไฟล์ debug.keystore ที่ root ของ repo) ลายเซ็นจะได้ไม่เปลี่ยน อัปเดตทับได้เลย
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      # บังคับให้ Gradle เซ็นด้วย debug.keystore ของ repo เสมอ (ไม่พึ่งการหาไฟล์ใน ~/.android)
      - name: Gradle init script (fixed key)
        run: |
          cat > "$RUNNER_TEMP/fixed-key.gradle" <<EOF
          allprojects {
            pluginManager.withPlugin('com.android.application') {
              android.signingConfigs.debug {
                storeFile new File('$GITHUB_WORKSPACE/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
              }
            }
          }
          EOF

      - name: Build APK (coreDebug, signed with the debug key)
        working-directory: port/android-decomp
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          # versionCode เพิ่มทุกรอบ (ต้องไม่ต่ำกว่าตัวที่ติดตั้งอยู่) เครื่องบางรุ่นไม่ยอมติดตั้งทับเวอร์ชันเลขเท่าเดิม
          ./gradlew assembleCoreDebug -I "$RUNNER_TEMP/fixed-key.gradle" -Pre4.versionCode=$((200 + GITHUB_RUN_NUMBER))

      # แค่แสดงลายเซ็นไว้ดู ถ้าล้มก็ไม่เป็นไร (ไม่ให้ขวางการอัปโหลด APK)
      - name: Show APK signature
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs port/android-decomp/app/build/outputs/apk/core/debug/*.apk | grep -E "certificate (DN|SHA-256)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-apk
          path: port/android-decomp/app/build/outputs/apk/core/debug/*.apk
