name: Build APK

on:
  workflow_dispatch:
    inputs:
      opt:
        description: "ระดับ optimisation ของ core (2 = เหมือนเดิม/เร็วตอนเล่น, 1 = คอมไพล์เร็วขึ้น)"
        default: "2"
        type: choice
        options: ["2", "1"]

env:
  NDK_VERSION: 28.2.13676358
  # ccache ครอบทั้งตัว core (port/whole) และ native ของแอป (src/main/cpp)
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_COMPILERCHECK: content        # NDK แตกใหม่ทุกรอบ mtime เปลี่ยน -> เช็คจากเนื้อไฟล์แทน
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: "true"
  CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # restore_originals.py ต้องใช้ประวัติ commit

      - name: Apply modern-controls changes
        run: |
          unzip -o modern-controls-v2.zip
          python3 restore_originals.py
          python3 apply_modern_controls.py
          python3 apply_touchlook.py
          python3 apply_aimwalk.py
          python3 apply_bonedump.py
          unzip -o hide-hud-v3.zip
          python3 apply_hidehud.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ccache: ครั้งแรกช้าเท่าเดิม ครั้งต่อไปคอมไพล์ใหม่เฉพาะไฟล์ที่เปลี่ยน
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-arm64-opt${{ inputs.opt || '2' }}
          max-size: 1500M

      # แคช Gradle (ดีกว่า actions/cache เดิม: เก็บ wrapper + dependency + build cache)
      - uses: gradle/actions/setup-gradle@v4

      # ไม่ต้องรัน whole_setup_linux.sh แล้ว (มันลง i386/ARM32 cross/qemu/mesa/ffmpeg... ที่ build Android ไม่ใช้)
      # ใช้ NDK ที่มากับ runner ถ้ามี ไม่งั้นโหลดผ่าน sdkmanager
      - name: Locate NDK r28c
        run: |
          NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -f "$NDK/source.properties" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          fi
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          python3 --version; cmake --version | head -1; ninja --version

      - name: Build game core (.so)
        run: port/tools/whole_build_android.sh --ndk "$NDK" --abi arm64-v8a --opt "${{ inputs.opt || '2' }}"

      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Gradle init script (fixed key)
        run: |
          cat > "$RUNNER_TEMP/fixed-key.gradle" <<EOF
          allprojects {
            pluginManager.withPlugin('com.android.application') {
              android.signingConfigs.debug {
                storeFile new File('$GITHUB_WORKSPACE/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
              }
            }
          }
          EOF

      # -Pandroid.injected.build.abi: คอมไพล์/แพ็กเฉพาะ arm64-v8a (core .so มีแค่ arm64 อยู่แล้ว
      #   เดิม Gradle เสียเวลาคอมไพล์ native ของแอปให้ armeabi-v7a ฟรี ๆ ด้วย)
      - name: Build APK (coreDebug, signed with the debug key)
        working-directory: port/android-decomp
        run: |
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          ./gradlew assembleCoreDebug \
            -I "$RUNNER_TEMP/fixed-key.gradle" \
            -Pre4.versionCode=$((200 + GITHUB_RUN_NUMBER)) \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            --parallel --build-cache

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: List built APKs
        run: |
          find port/android-decomp/app/build/outputs -name '*.apk' -print
          find port/android-decomp/app/build/outputs -name '*.apk' | grep -q . || { echo "::error::ไม่พบไฟล์ APK"; exit 1; }

      - name: Show APK signature
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          APK=$(find port/android-decomp/app/build/outputs/apk -name '*.apk' | head -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-256)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: CubeEvil4-apk
          path: port/android-decomp/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          compression-level: 0   # APK บีบอยู่แล้ว ไม่ต้องบีบซ้ำ
